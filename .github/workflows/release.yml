name: Release

# Publishes to npm when a version tag is pushed: git tag v0.1.0 && git push --tags
# Requires the repository secret NPM_TOKEN (an npm automation token).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
